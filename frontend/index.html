<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i> Task Manager</h1>
            <p>Organize your day, one task at a time</p>
        </header>

        <!-- Add Task Form -->
        <div class="add-task-section">
            <form id="taskForm">
                <div class="form-group">
                    <input type="text" id="taskTitle" placeholder="What do you need to do?" required>
                </div>
                <div class="form-group">
                    <textarea id="taskDescription" placeholder="Add a description (optional)"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </form>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">
            <div class="loading">Loading tasks...</div>
        </div>

        <!-- Task Stats -->
        <div class="task-stats" id="taskStats">
            <span>0 tasks</span>
            <span>0 completed</span>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Edit Task</h2>
            <form id="editForm">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <input type="text" id="editTitle" placeholder="Task title" required>
                </div>
                <div class="form-group">
                    <textarea id="editDescription" placeholder="Task description"></textarea>
                </div>
                <div class="form-group checkbox">
                    <label>
                        <input type="checkbox" id="editCompleted"> Mark as completed
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Update Task</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
